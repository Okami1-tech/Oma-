<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4a1a6b 0%, #ff69b4 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 10;
        }

        .content {
            text-align: center;
            max-width: 90%;
            width: 100%;
            padding: 20px;
        }

        .message {
            font-size: 2rem;
            color: white;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.6;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .message.active {
            opacity: 1;
            transform: translateY(0);
        }

        .tap-indicator {
            margin-top: 30px;
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            opacity: 0;
            transform: scale(0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .heart-container {
            margin: 30px 0;
            opacity: 0;
            transform: scale(0);
            transition: all 1s ease;
        }

        .heart-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .heart {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff69b4, #e91e63);
            position: relative;
            transform: rotate(-45deg);
            animation: heartbeat 2s infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff69b4, #e91e63);
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            25% { transform: rotate(-45deg) scale(1.1); }
            50% { transform: rotate(-45deg) scale(1); }
            75% { transform: rotate(-45deg) scale(1.05); }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { transform: translateY(-100px) rotate(180deg); opacity: 1; }
        }

        .final-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,105,180,0.3), transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
        }

        .final-glow.activate {
            animation: glowFlash 2s ease;
        }

        @keyframes glowFlash {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .message {
                font-size: 1.5rem;
            }
            
            .heart {
                width: 80px;
                height: 80px;
            }
            
            .heart::before,
            .heart::after {
                width: 80px;
                height: 80px;
            }
            
            .heart::before {
                top: -40px;
            }
            
            .heart::after {
                left: 40px;
            }
        }

        @media (max-width: 480px) {
            .message {
                font-size: 1.2rem;
            }
            
            .heart {
                width: 60px;
                height: 60px;
            }
            
            .heart::before,
            .heart::after {
                width: 60px;
                height: 60px;
            }
            
            .heart::before {
                top: -30px;
            }
            
            .heart::after {
                left: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="content">
            <div class="message" id="message">Loading...</div>
            <div class="heart-container" id="heartContainer">
                <div class="heart"></div>
            </div>
            <div class="tap-indicator" id="tapIndicator">Tap anywhere to continue...</div>
        </div>
    </div>

    <div class="final-glow" id="finalGlow"></div>

    <audio id="ambientMusic" loop preload="none">
        <source src="audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
    </audio>

    <script>
        class RomanticExperience {
            constructor() {
                this.messages = [
                    "There's nothing here... but tap anyway.",
                    "Still nothing... you sure you want to keep going?",
                    "Okay wait... something might be here.",
                    "If you're still tapping... it means you matter.",
                    "And if you matter... then this isn't nothing anymore.",
                    "Because someone was thinking about you... all day."
                ];
                
                this.finalMessage = "There is my heart... and it's all yours.\nGet well soon Jessica Ineh, my love 💜";
                this.currentStep = 0;
                this.canTap = true;
                
                this.messageElement = document.getElementById('message');
                this.tapIndicator = document.getElementById('tapIndicator');
                this.heartContainer = document.getElementById('heartContainer');
                this.particlesContainer = document.getElementById('particles');
                this.ambientMusic = document.getElementById('ambientMusic');
                this.finalGlow = document.getElementById('finalGlow');
                
                this.init();
            }
            
            init() {
                this.createParticles();
                this.updateDisplay();
                this.setupEventListeners();
            }
            
            createParticles() {
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 6 + 's';
                    particle.style.width = (Math.random() * 4 + 2) + 'px';
                    particle.style.height = particle.style.width;
                    this.particlesContainer.appendChild(particle);
                }
            }
            
            setupEventListeners() {
                document.addEventListener('click', () => this.handleTap());
                document.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.handleTap();
                }, { passive: false });
            }
            
            handleTap() {
                if (!this.canTap || this.currentStep > 6) return;
                
                this.canTap = false;
                
                // Vibrate if supported
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
                
                // Start music after first tap
                if (this.currentStep === 0 && this.ambientMusic.paused) {
                    this.ambientMusic.play().catch(e => console.log('Audio play failed:', e));
                }
                
                if (this.currentStep < 6) {
                    this.nextStep();
                } else {
                    this.showFinal();
                }
                
                setTimeout(() => {
                    this.canTap = true;
                }, 300);
            }
            
            nextStep() {
                this.currentStep++;
                this.updateDisplay();
                this.animateTypewriter(this.getMessage(), 50);
            }
            
            showFinal() {
                this.currentStep++;
                this.messageElement.textContent = '';
                this.animateTypewriter(this.finalMessage, 30);
                
                // Show heart and glow
                setTimeout(() => {
                    this.heartContainer.classList.add('show');
                    this.finalGlow.classList.add('activate');
                    
                    // Add sparkles
                    this.createSparkles();
                }, 1000);
            }
            
            updateDisplay() {
                if (this.currentStep < 6) {
                    this.tapIndicator.style.opacity = '1';
                    this.heartContainer.style.display = 'none';
                } else {
                    this.tapIndicator.style.opacity = '0';
                    this.heartContainer.style.display = 'block';
                }
            }
            
            animateTypewriter(text, speed) {
                const lines = text.split('\n');
                let currentLine = 0;
                let currentChar = 0;
                let fullText = '';
                
                const typeNext = () => {
                    if (currentLine < lines.length) {
                        if (currentChar < lines[currentLine].length) {
                            fullText += lines[currentLine][currentChar];
                            this.messageElement.textContent = fullText;
                            currentChar++;
                            
                            setTimeout(typeNext, speed);
                        } else {
                            fullText += '\n';
                            currentLine++;
                            currentChar = 0;
                            setTimeout(typeNext, speed * 2);
                        }
                    }
                };
                
                // Fade out current content first
                this.messageElement.style.transition = 'opacity 0.3s ease';
                this.messageElement.style.opacity = '0';
                
                setTimeout(() => {
                    this.messageElement.style.opacity = '1';
                    typeNext();
                }, 300);
            }
            
            getMessage() {
                return this.messages[this.currentStep - 1] || this.finalMessage;
            }
            
            createSparkles() {
                for (let i = 0; i < 20; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.style.position = 'absolute';
                    sparkle.style.width = '8px';
                    sparkle.style.height = '8px';
                    sparkle.style.background = '#fff';
                    sparkle.style.borderRadius = '50%';
                    sparkle.style.boxShadow = '0 0 10px #fff, 0 0 20px #ff69b4';
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.opacity = '0';
                    sparkle.style.zIndex = '100';
                    
                    document.body.appendChild(sparkle);
                    
                    // Animate sparkle
                    const animation = sparkle.animate([
                        { opacity: 0, transform: 'scale(0)', offset: 0 },
                        { opacity: 1, transform: 'scale(1)', offset: 0.5 },
                        { opacity: 0, transform: 'scale(0)', offset: 1 }
                    ], {
                        duration: 2000,
                        easing: 'ease-out'
                    });
                    
                    animation.onfinish = () => {
                        sparkle.remove();
                    };
                }
            }
        }
        
        // Initialize the experience when page loads
        window.addEventListener('load', () => {
            new RomanticExperience();
        });
    </script>
</body>
  </html>
